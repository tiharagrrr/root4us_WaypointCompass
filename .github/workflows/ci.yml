name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, boundaries, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waypoint/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm build
      # The API contract: fails if a controller or DTO changed without
      # `pnpm api:gen` and a committed openapi.json.
      - name: openapi.json is up to date
        run: pnpm api:gen && git diff --exit-code apps/backend/openapi.json

  database:
    name: Migrations and database guarantees
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d waypoint"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DIRECT_URL: postgres://compass_owner:compass_owner@localhost:5432/waypoint
      DATABASE_URL: postgres://compass_app:compass_app@localhost:5432/waypoint
      SEED_PASSWORD: ci-seed-password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waypoint/shared build
      - name: Create the three database roles
        run: >-
          psql "postgres://postgres:postgres@localhost:5432/waypoint" -v ON_ERROR_STOP=1
          -v db=waypoint -v owner_password=compass_owner -v app_password=compass_app
          -v readonly_password=compass_readonly -f deploy/db/roles.sql
      - run: pnpm --filter api db:migrate
      # Fails if a schema file changed without a committed migration.
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api db:check
      - run: pnpm --filter api db:seed
      - name: Database guarantees and the API e2e suites (sign-in, scope, permissions)
        run: pnpm --filter api test
        env:
          TEST_DIRECT_URL: ${{ env.DIRECT_URL }}
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_REDIS_URL: redis://localhost:6379

  compose:
    name: docker compose up (smoke test)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait api web
      - run: curl -fsS http://localhost:8080/api/health
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
