# Waypoint: complete stack for judges and local work.
#
#   cp .env.example .env      # optional, defaults work without it
#   docker compose up --build # web on http://localhost:8080
#
# Start order: postgres -> seed (migrations + datasets, one-shot) -> api/worker -> web.
# Observability (Prometheus, Loki, Alloy, Grafana) is opt-in:
#   docker compose --profile observability up
name: waypoint

x-api-image: &api-image
  image: waypoint-api:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  # The API and worker connect as compass_app, which row-level security filters.
  DATABASE_URL: postgres://compass_app:${COMPASS_APP_PASSWORD:-compass_app}@postgres:5432/${POSTGRES_DB:-waypoint}
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:8080}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-long-random-string}
  SESSION_EXPIRES_IN_DAYS: ${SESSION_EXPIRES_IN_DAYS:-7}
  S3_ENDPOINT: http://s3:3900
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-pod}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-waypoint}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-waypoint-dev-secret}
  S3_FORCE_PATH_STYLE: "true"
  DEMO_CLOCK: ${DEMO_CLOCK:-}
  DEMO_MODE: ${DEMO_MODE:-true}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      TZ: UTC
      # Passwords for the three database roles, created on first start by
      # deploy/db/init/00-roles.sh (run `docker compose down -v` to recreate).
      COMPASS_OWNER_PASSWORD: ${COMPASS_OWNER_PASSWORD:-compass_owner}
      COMPASS_APP_PASSWORD: ${COMPASS_APP_PASSWORD:-compass_app}
      COMPASS_READONLY_PASSWORD: ${COMPASS_READONLY_PASSWORD:-compass_readonly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/db/roles.sql:/waypoint/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Garage: S3-compatible object storage for proof-of-delivery photos and
  # signatures. One node, one replica; Supabase Storage replaces it in production.
  s3:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      # Garage's own secrets; deploy/s3/garage.toml deliberately holds none.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-waypoint-admin-token}
    volumes:
      - ./deploy/s3/garage.toml:/etc/garage.toml:ro
      - s3meta:/var/lib/garage/meta
      - s3data:/var/lib/garage/data
    ports:
      - "${S3_PORT:-9000}:3900"        # S3 API
      - "${S3_ADMIN_PORT:-9001}:3903"  # admin API: /health, buckets, keys
    healthcheck:
      # The image carries no shell, so the check is the garage binary itself:
      # it exits 1 until the cluster can serve reads and writes.
      test: ["CMD", "/garage", "health"]
      # Unhealthy until s3-init applies the layout, a few seconds after start.
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: the single-node cluster layout, the private POD bucket, and the S3
  # key the API signs URLs with (idempotent, see deploy/s3/garage-init.mjs).
  # node:22-alpine is the base of the api image, so it costs no extra pull.
  s3-init:
    image: node:22-alpine
    entrypoint: ["node", "/init/garage-init.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://s3:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-waypoint-admin-token}
      S3_ENDPOINT: http://s3:3900
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-pod}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-waypoint}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-waypoint-dev-secret}
    volumes:
      - ./deploy/s3:/init:ro
    depends_on:
      s3:
        condition: service_started
    restart: "no"

  # One-shot: applies migrations, then seeds the shared datasets (idempotent).
  # Runs as compass_owner, the only role that changes the schema.
  seed:
    <<: *api-image
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      <<: *api-env
      DIRECT_URL: postgres://compass_owner:${COMPASS_OWNER_PASSWORD:-compass_owner}@postgres:5432/${POSTGRES_DB:-waypoint}
      SEED_PASSWORD: ${SEED_PASSWORD:-Waypoint@2026}
    # The dataset CSVs are confidential and git-ignored, so a fresh clone's image holds none of
    # them: the seed reads them from the host folder instead. Copy the files into data/seed
    # (flat, or in the dataset's own folders) before `docker compose up`.
    volumes:
      - ${SEED_DATA_DIR:-./data/seed}:/repo/data/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *api-image
    restart: unless-stopped
    environment: *api-env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  # Background jobs (allocation runs, notifications, outbox relay).
  worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # Caddy: serves the React PWA and proxies /api to the API on one origin.
  web:
    image: waypoint-web:local
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy

  # --- Observability (profile: observability) --------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.10.2
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  redisdata:
  s3meta:
  s3data:
  caddydata:
  grafanadata:
